[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors"] }
mork-rust-sdk = "0.2.1"
reqwest = { version = "0.11", features = ["json"] }
urlencoding = "2.1"
rocket = "0.5"
